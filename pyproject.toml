[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-profile-lint"
version = "0.1.1"
description = "Check Open Knowledge Format bundles against the spec and the rules each bundle declares for itself."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ForgeFlow, S.L." }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ForgeFlow/okf-profile-lint"
"Open Knowledge Format" = "https://okf.md/"

[project.scripts]
okf-profile-lint = "okf_profile_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
